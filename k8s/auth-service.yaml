apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  labels:
    app: auth-service
data:
  PORT: "3000"
  REDIS_HOST: "auth-redis-service"
  REDIS_PORT: "6379"
  USER_SERVICE_URL: "user-service:50051"
  AUTH_GRPC_URL: "0.0.0.0:50052"

---
apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
  labels:
    app: auth-service
type: Opaque
data:
  # Base64 encoded values for development (Please change in production)
  # "postgresql://postgres:postgres@auth-postgres-service:5432/auth_db"
  DATABASE_URL: cG9zdGdyZXNxbDovL3Bvc3RncmVzOnBvc3RncmVzQGF1dGgtcG9zdGdyZXUtc2VydmljZTo1NDMyL2F1dGhfZGI=
  # "superSecretJwtPrivateKeyExample"
  JWT_SECRET: c3VwZXJTZWNyZXRKd3RQcml2YXRlS2V5RXhhbXBsZQ==

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-nest-kafka:latest # Your built Docker image tag
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 50052
              name: grpc
          env:
            # Bind non-sensitive values from ConfigMap
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: PORT
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: REDIS_PORT
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: USER_SERVICE_URL
            - name: AUTH_GRPC_URL
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: AUTH_GRPC_URL
            # Bind sensitive values from Secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: JWT_SECRET

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      name: http
    - protocol: TCP
      port: 50052
      targetPort: 50052
      name: grpc
  type: ClusterIP
