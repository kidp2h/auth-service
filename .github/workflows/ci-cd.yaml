name: Auth Service CI/CD & GitOps Pipeline

on:
  push:
    branches:
      - development
      - staging
      - master
  pull_request:
    branches:
      - development
      - staging
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # STAGE 1: Quality Gate (Lint, Unit Test, TypeScript Build Verification)
  # Runs on: development, staging, master (Push & PR)
  # ============================================================================
  quality-gate:
    name: 🧪 Quality Gate (Lint, Test & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository source code
        uses: actions/checkout@v4

      - name: Setup Node.js runtime dynamically from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies strictly via package-lock
        run: npm ci

      - name: Step 1 - Execute ESLint code quality checks
        run: npm run lint

      - name: Step 2 - Execute unit test suite
        run: npm run test --if-present -- --passWithNoTests

      - name: Step 3 - Verify TypeScript compilation and build output
        run: npm run build

  # ============================================================================
  # STAGE 2: CD Containerization (Build & Push Docker Image to Docker Hub)
  # Runs ONLY on: staging and master (prod)
  # (development branch only runs Stage 1)
  # ============================================================================
  build-and-push:
    name: 🐳 Build & Push Container Image
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'staging' || github.ref_name == 'master')
    outputs:
      env: ${{ steps.vars.outputs.env }}
      tag: ${{ steps.vars.outputs.tag }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Resolve target environment and image tag from branch
        id: vars
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          FULL_SHA="${GITHUB_SHA}"
          SHORT_SHA=$(echo "$FULL_SHA" | cut -c1-7)

          echo "Branch: $BRANCH | SHA: $SHORT_SHA"

          if [ "$BRANCH" = "staging" ]; then
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "tag=staging-${SHORT_SHA}" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "master" ]; then
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "tag=prod-${SHORT_SHA}" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "tag=staging-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Docker Buildx builder instance
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Docker Hub Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-tag container image to registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:${{ steps.vars.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:${{ steps.vars.outputs.env }}-latest

  # ============================================================================
  # STAGE 3: GitOps Dispatch (Trigger Central Repo Argo CD Synchronization)
  # Runs ONLY on: staging and master (prod)
  # ============================================================================
  dispatch-gitops:
    name: 🚀 Trigger Central GitOps Deployment
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'staging' || github.ref_name == 'master')

    steps:
      - name: Dispatch repository webhook event to central GitOps repository
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITOPS_PAT_TOKEN }}
          repository: kidp2h/ecommerce-microservices
          event-type: service_updated
          client-payload: |
            {
              "service": "auth",
              "env": "${{ needs.build-and-push.outputs.env }}",
              "tag": "${{ needs.build-and-push.outputs.tag }}",
              "commit_sha": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}"
            }
