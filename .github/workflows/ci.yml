# CI/CD for auth-service.
#
# - Pull requests: lint, build, test.
# - Push to master: the same checks, then build and push an immutable image
#   tagged with the short commit SHA, then notify the GitOps repo with a
#   repository_dispatch (service_updated). The GitOps repo's own gitops-sync
#   workflow pins the tag in k8s/environment/dev/auth/release.yaml, so this
#   repo never writes into the GitOps repo. Prod is promoted from the GitOps
#   repo (promote workflow), never built again: build once, promote many.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN  - Docker Hub access token with push scope
#   GITOPS_PAT_TOKEN                     - token allowed to send repository_dispatch
#                                          to kidp2h/ecommerce-microservices
#
# Run locally with act: npm run act:ci (see .actrc, .secrets.example).

name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: nthinhd3v/auth-service
  SERVICE: auth
  GITOPS_REPO: kidp2h/ecommerce-microservices

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint:check
      - run: npm run build
      - run: npm test -- --passWithNoTests

  image:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Notify the GitOps repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITOPS_PAT_TOKEN }}
          repository: ${{ env.GITOPS_REPO }}
          event-type: service_updated
          client-payload: |
            {
              "service": "${{ env.SERVICE }}",
              "env": "dev",
              "tag": "${{ needs.image.outputs.tag }}",
              "digest": "${{ needs.image.outputs.digest }}",
              "commit_sha": "${{ github.sha }}",
              "repository": "${{ github.repository }}"
            }
