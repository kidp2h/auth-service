syntax = "proto3";

// auth-service owns this contract. Versioned package: breaking changes go to a
// new package (auth.v2); within auth.v1 only add optional fields and never
// reuse or renumber existing ones.
package auth.v1;

service AuthService {
  rpc VerifyToken (VerifyTokenRequest) returns (VerifyTokenResponse);
}

message VerifyTokenRequest {
  string token = 1;
}

message VerifyTokenResponse {
  bool is_valid = 1;
  string user_id = 2;
  string email = 3;
}
